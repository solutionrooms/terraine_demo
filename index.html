<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPU City — flat tile grid + 3D instanced props (realtime)</title>
<style>
  :root { --fg:#eaf0f8; --dim:#92a0b6; --ok:#5ad28b; --warn:#ffb03a; }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fc6e8; }
  canvas { display:block; }
  * { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  #hud {
    position:fixed; top:14px; left:14px; z-index:10; pointer-events:none;
    color:var(--fg); background:rgba(14,20,30,0.74);
    border:1px solid rgba(255,255,255,0.10); border-radius:10px;
    padding:12px 14px 10px; width:224px;
    backdrop-filter:blur(6px); box-shadow:0 8px 28px rgba(0,0,0,0.45); user-select:none;
  }
  #hud .title { font-size:11px; letter-spacing:1.4px; color:var(--dim); margin-bottom:8px; }
  #hud .row { display:flex; justify-content:space-between; font-size:12px; line-height:20px; }
  #hud .k { color:var(--dim); }
  #hud .v { color:var(--fg); font-variant-numeric:tabular-nums; }
  #hud-calls.ok { color:var(--ok); } #hud-calls.warn { color:var(--warn); }
  #spark { display:block; width:196px; height:32px; margin:6px 0 4px; }
  .grp-label { font-size:10px; letter-spacing:1.2px; color:var(--dim); margin-top:11px; }
  .btns { display:flex; gap:5px; margin-top:5px; pointer-events:auto; flex-wrap:wrap; }
  .btns button {
    flex:1 1 0; min-width:30px; pointer-events:auto;
    background:rgba(255,255,255,0.06); color:var(--fg);
    border:1px solid rgba(255,255,255,0.10); border-radius:6px;
    padding:5px 0; font-size:10.5px; cursor:pointer;
  }
  .btns button:hover { background:rgba(255,255,255,0.15); }
  .btns button.active { background:var(--ok); color:#06250f; border-color:var(--ok); }
  #stressBtn.on { background:var(--warn); color:#3a2400; border-color:var(--warn); }
  .hint { font-size:10.5px; color:var(--dim); margin-top:10px; line-height:15px; }
  #loading {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(8,12,18,0.6); color:#fff; font-size:14px; letter-spacing:1px; pointer-events:none;
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="hud">
    <div class="title">GPU CITY · FLAT GRID + 3D PROPS</div>
    <div class="row"><span class="k">Draw calls</span><span id="hud-calls" class="v">–</span></div>
    <div class="row"><span class="k">FPS</span><span id="hud-fps" class="v">–</span></div>
    <canvas id="spark" width="196" height="32"></canvas>
    <div class="row"><span class="k">Grid</span><span id="hud-grid" class="v">–</span></div>
    <div class="row"><span class="k">Tiles</span><span id="hud-tiles" class="v">–</span></div>
    <div class="row"><span class="k">Trees / Bldgs</span><span id="hud-props" class="v">–</span></div>
    <div class="row"><span class="k">Edits / s</span><span id="hud-edits" class="v">–</span></div>
    <div class="row"><span class="k">Tool</span><span id="hud-tool" class="v">Tree · 1×1</span></div>

    <div class="grp-label">BUILD</div>
    <div class="btns" id="tools">
      <button data-tool="tree">Tree</button>
      <button data-tool="bldg">Bldg</button>
      <button data-tool="road">Road</button>
      <button data-tool="grass">Grass</button>
      <button data-tool="water">Water</button>
      <button data-tool="clear">Clear</button>
    </div>
    <div class="grp-label">BRUSH</div>
    <div class="btns" id="brushes">
      <button data-brush="1">1×1</button>
      <button data-brush="4">4×4</button>
      <button data-brush="16">16×16</button>
    </div>
    <div class="grp-label">GRID</div>
    <div class="btns" id="scales">
      <button data-n="64">64</button>
      <button data-n="256">256</button>
      <button data-n="1024">1024</button>
      <button data-n="2048">2048</button>
      <button data-n="4096">4096</button>
    </div>
    <div class="grp-label">SHADOWS</div>
    <div class="btns">
      <button id="shadowBtn" class="active">on</button>
    </div>
    <div class="grp-label">STRESS TEST</div>
    <div class="btns">
      <button id="stressBtn">randomize 5% of tiles / frame</button>
    </div>
    <div class="hint">pick a tool + size, click to paint · drag: rotate<br>arrows: pan · Z/X: zoom · 1–5: grid · H: shadows · S: stress</div>
  </div>

  <div id="loading">building world…</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ───────────────────────────── constants ─────────────────────────────
const WORLD = 200;
const HALF  = WORLD / 2;
const LAYERS = 32;          // 32 tile textures (texture array)
const TILE   = 64;
const SCALES = [64, 256, 1024, 2048, 4096];
const PROP = { NONE: 0, TREE: 1, BLDG: 2 };
const STRESS_MAX = 40000;   // cap stress edits/frame so huge grids stay interactive
// Props live in a CHUNKS×CHUNKS grid of InstancedMesh per layer, each with a bounding sphere, so
// Three frustum-culls off-screen chunks. 6×6 = 36 chunks → ≤ 73 draw calls fully zoomed out;
// zoom in and culled chunks drop out (watch the HUD draw-call count fall). Budget independent of grid.
const CHUNKS = 6, NCHUNK = CHUNKS * CHUNKS, CHUNK_W = WORLD / CHUNKS;
const TREE_CHUNK_CAP = 6000, BLDG_CHUNK_CAP = 1800;

// terrain texture-index groups inside the 32-layer atlas
const GRASS0 = 0, GRASS_N = 12, SAND0 = 12, ROCK0 = 18, ROAD0 = 24, WATER0 = 30;

let N, cellSize, propScale;
let stateData, stateTex;                 // R8 terrain-index texture (the scalable terrain layer)
let terrainMesh;
let treeMeshes = [], bldgMeshes = [];    // per-chunk InstancedMesh (length NCHUNK)
const treeCount = new Int32Array(NCHUNK), bldgCount = new Int32Array(NCHUNK);
let treeTileOf = [], bldgTileOf = [];    // per-chunk Int32Array: instance idx -> tile
const propAt = new Map();                // tileIndex -> { c, layer:0|1, idx }
const dirtyChunks = new Set();           // chunks whose instanceMatrix needs re-upload
let totalTrees = 0, totalBldgs = 0;

let currentTool = 'tree', brush = 1, stress = false;

// ───────────────────────────── renderer / scene / lights ─────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // sun + geometry are static -> only re-render the shadow map on edits,
                                          // not every camera move (else 72 chunk casters redraw every frame)
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const sky = new THREE.Color(0x9fc6e8);
scene.background = sky;
scene.fog = new THREE.Fog(sky, WORLD * 0.9, WORLD * 2.6);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.5, 3000);
camera.position.set(WORLD * 0.42, WORLD * 0.5, WORLD * 0.72);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 14;
controls.maxDistance = 900;
controls.maxPolarAngle = Math.PI * 0.49;
controls.listenToKeyEvents(window);
controls.keyPanSpeed = 16;
controls.update();

const sun = new THREE.DirectionalLight(0xfff1d8, 2.7);
sun.position.set(WORLD * 0.5, WORLD * 0.42, WORLD * 0.32);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = WORLD * 3;
const scExt = HALF * 1.4;
sun.shadow.camera.left = -scExt; sun.shadow.camera.right = scExt;
sun.shadow.camera.top = scExt;   sun.shadow.camera.bottom = -scExt;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x55692f, 0.55));

// ───────────────────────────── 32 procedural tile textures (texture array) ───────────────
function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }
function tileBase(l) {
  if (l < SAND0) { const t = l / GRASS_N; return [70 + t * 30, 120 + (1 - t) * 40 + l * 3, 50 + t * 20]; }
  if (l < ROCK0) return [186 - (l - SAND0) * 6, 168 - (l - SAND0) * 5, 120 - (l - SAND0) * 6];
  if (l < ROAD0) return [128 + (l - ROCK0) * 4, 130 + (l - ROCK0) * 4, 136 + (l - ROCK0) * 3];
  if (l < WATER0) return [54 + (l - ROAD0) * 3, 56 + (l - ROAD0) * 3, 62 + (l - ROAD0) * 3];
  return [40 + (l - WATER0) * 8, 96 + (l - WATER0) * 10, 150 + (l - WATER0) * 16];
}
function tileNoise(l) { return l < SAND0 ? 16 : l < ROCK0 ? 14 : l < ROAD0 ? 10 : l < WATER0 ? 7 : 18; }
function genTileArray() {
  const data = new Uint8Array(TILE * TILE * 4 * LAYERS);
  for (let l = 0; l < LAYERS; l++) {
    const base = tileBase(l), noise = tileNoise(l), off = l * TILE * TILE * 4;
    for (let p = 0; p < TILE * TILE; p++) {
      const n = (Math.random() * 2 - 1) * noise;
      data[off + p * 4] = clamp255(base[0] + n);
      data[off + p * 4 + 1] = clamp255(base[1] + n);
      data[off + p * 4 + 2] = clamp255(base[2] + n);
      data[off + p * 4 + 3] = 255;
    }
    if (l >= ROAD0 && l <= ROAD0 + 3) {
      for (let y = 0; y < TILE; y++) {
        if ((y >> 3) % 2 === 0) continue;
        for (let x = 30; x < 34; x++) { const idx = off + (y * TILE + x) * 4; data[idx] = 220; data[idx + 1] = 200; data[idx + 2] = 70; }
      }
    }
  }
  const tex = new THREE.DataArrayTexture(data, TILE, TILE, LAYERS);
  tex.format = THREE.RGBAFormat; tex.type = THREE.UnsignedByteType;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true; tex.needsUpdate = true;
  return tex;
}
const tileArray = genTileArray();

// ───────────────────────────── 3D prop geometry (~500-poly tree, box building) ────────────
function addColor(geo, r, g, b) {
  const n = geo.attributes.position.count, col = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { col[i * 3] = r; col[i * 3 + 1] = g; col[i * 3 + 2] = b; }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  if (geo.attributes.uv) geo.deleteAttribute('uv');
  return geo;
}
function buildTreeGeometry() {
  const trunk = addColor(new THREE.CylinderGeometry(0.06, 0.09, 0.55, 12).translate(0, 0.275, 0), 0.37, 0.25, 0.14);
  const c1 = addColor(new THREE.ConeGeometry(0.46, 0.6, 26, 2).translate(0, 0.7, 0), 0.17, 0.43, 0.19);
  const c2 = addColor(new THREE.ConeGeometry(0.35, 0.55, 26, 2).translate(0, 1.0, 0), 0.20, 0.47, 0.21);
  const c3 = addColor(new THREE.ConeGeometry(0.23, 0.5, 26, 2).translate(0, 1.3, 0), 0.24, 0.52, 0.24);
  const g = mergeGeometries([trunk, c1, c2, c3], false);
  g.computeVertexNormals();
  return g;
}
const treeGeo = buildTreeGeometry();
const bldgGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);   // base at y=0
const treeMat = new THREE.MeshLambertMaterial({ vertexColors: true }); // shared across all chunks
const bldgMat = new THREE.MeshLambertMaterial();                       // tinted per-instance via instanceColor

const terrainGeo = new THREE.PlaneGeometry(WORLD, WORLD);
const dummy = new THREE.Object3D();
const tmpColor = new THREE.Color();

// ───────────────────────────── terrain material (32-texture atlas, lit, shadowed) ─────────
function makeTerrainMat() {
  const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uState = { value: stateTex };
    sh.uniforms.uTiles = { value: tileArray };
    sh.uniforms.uN = { value: N };
    sh.uniforms.uHalf = { value: HALF };
    sh.uniforms.uWorld = { value: WORLD };
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec2 vWXZ;')
      .replace('#include <begin_vertex>', '#include <begin_vertex>\nvWXZ = (modelMatrix * vec4(position,1.0)).xz;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
        varying vec2 vWXZ;
        uniform sampler2D uState; uniform sampler2DArray uTiles;
        uniform float uN; uniform float uHalf; uniform float uWorld;`)
      .replace('#include <map_fragment>', `
        vec2 cell = ((vWXZ + uHalf) / uWorld) * uN;
        float layer = floor(texture(uState, (floor(cell) + 0.5) / uN).r * 255.0 + 0.5);
        diffuseColor.rgb *= texture(uTiles, vec3(fract(cell), layer)).rgb;`);
  };
  return m;
}

// ───────────────────────────── world build / scale switch ────────────────────────────────
function tileWX(x) { return -HALF + (x + 0.5) * cellSize; }

function disposeWorld() {
  if (terrainMesh) { scene.remove(terrainMesh); terrainMesh.material.dispose(); }
  for (const arr of [treeMeshes, bldgMeshes]) for (const m of arr) { scene.remove(m); m.dispose(); }  // shared geo/mat kept
  treeMeshes = []; bldgMeshes = []; treeTileOf = []; bldgTileOf = [];
  if (stateTex) stateTex.dispose();
}

function createWorld(n) {
  disposeWorld();
  N = n; cellSize = WORLD / N;
  propScale = Math.min(3.0, Math.max(0.55, cellSize));   // props ≈ tile-sized, clamped at extremes

  stateData = new Uint8Array(n * n);                      // R8 terrain index per tile
  stateTex = new THREE.DataTexture(stateData, n, n, THREE.RedFormat, THREE.UnsignedByteType);
  stateTex.magFilter = stateTex.minFilter = THREE.NearestFilter;
  stateTex.wrapS = stateTex.wrapT = THREE.ClampToEdgeWrapping;
  stateTex.unpackAlignment = 1;
  stateTex.needsUpdate = true;

  terrainMesh = new THREE.Mesh(terrainGeo, makeTerrainMat());
  terrainMesh.rotation.x = -Math.PI / 2;
  terrainMesh.receiveShadow = true;
  terrainMesh.frustumCulled = false;
  scene.add(terrainMesh);

  treeCount.fill(0); bldgCount.fill(0); propAt.clear(); dirtyChunks.clear();
  totalTrees = 0; totalBldgs = 0;
  const maxH = propScale * 9;                              // tallest building (for the bounding sphere)
  const radius = Math.sqrt(0.5 * CHUNK_W * CHUNK_W + maxH * maxH);
  for (let cz = 0; cz < CHUNKS; cz++) for (let cx = 0; cx < CHUNKS; cx++) {
    const c = cz * CHUNKS + cx;
    const tm = new THREE.InstancedMesh(treeGeo, treeMat, TREE_CHUNK_CAP);
    const bm = new THREE.InstancedMesh(bldgGeo, bldgMat, BLDG_CHUNK_CAP);
    const ctr = new THREE.Vector3(-HALF + (cx + 0.5) * CHUNK_W, maxH * 0.5, -HALF + (cz + 0.5) * CHUNK_W);
    for (const m of [tm, bm]) {
      m.castShadow = true; m.receiveShadow = true;
      m.frustumCulled = true;                              // ← the point: off-screen chunks are culled
      m.boundingSphere = new THREE.Sphere(ctr.clone(), radius);
      m.count = 0; m.visible = false;
    }
    scene.add(tm, bm);
    treeMeshes[c] = tm; bldgMeshes[c] = bm;
    treeTileOf[c] = new Int32Array(TREE_CHUNK_CAP);
    bldgTileOf[c] = new Int32Array(BLDG_CHUNK_CAP);
  }

  fillWorld();
  renderer.shadowMap.needsUpdate = true;   // re-render the static shadow map once for the new props
  updateHudStatic();
}

// ── chunked prop pools: place on edit, swap-remove on clear (reused matrices, no per-edit alloc) ─
function chunkOf(x, z) {
  let cx = ((tileWX(x) + HALF) / CHUNK_W) | 0; if (cx >= CHUNKS) cx = CHUNKS - 1;
  let cz = ((tileWX(z) + HALF) / CHUNK_W) | 0; if (cz >= CHUNKS) cz = CHUNKS - 1;
  return cz * CHUNKS + cx;
}
function setTreeInstance(c, idx, tile, variant) {
  const x = tile % N, z = (tile / N) | 0, h = variant / 255;
  dummy.position.set(tileWX(x), 0, tileWX(z));
  dummy.rotation.set(0, h * Math.PI * 2, 0);
  const s = propScale * (1.3 + h * 0.7);
  dummy.scale.set(s, s, s);
  dummy.updateMatrix();
  treeMeshes[c].setMatrixAt(idx, dummy.matrix);
  treeTileOf[c][idx] = tile;
}
function bldgColorFor(tile) {
  const h = ((tile * 2654435761) >>> 0) % 1000 / 1000;
  const g = 0.55 + 0.18 * h;
  return tmpColor.setRGB(g * 0.93, g * 0.95, g);   // cool concrete gray
}
function setBldgInstance(c, idx, tile, variant) {
  const x = tile % N, z = (tile / N) | 0, h = variant / 255;
  dummy.position.set(tileWX(x), 0, tileWX(z));
  dummy.rotation.set(0, (Math.floor(h * 4) * Math.PI / 2), 0);
  // chunky footprint; mostly low-rise with the occasional tower (cubic height bias)
  const foot = propScale * 0.92, height = propScale * (1.0 + h * h * h * 7.0);
  dummy.scale.set(foot, height, foot);
  dummy.updateMatrix();
  bldgMeshes[c].setMatrixAt(idx, dummy.matrix);
  bldgMeshes[c].setColorAt(idx, bldgColorFor(tile));
  bldgTileOf[c][idx] = tile;
}
function addProp(tile, type, variant) {
  removeProp(tile);
  const c = chunkOf(tile % N, (tile / N) | 0);
  if (type === PROP.TREE && treeCount[c] < TREE_CHUNK_CAP) {
    const idx = treeCount[c]++; setTreeInstance(c, idx, tile, variant);
    propAt.set(tile, { c, layer: 0, idx }); const m = treeMeshes[c]; m.count = treeCount[c]; m.visible = true; totalTrees++; dirtyChunks.add(c);
  } else if (type === PROP.BLDG && bldgCount[c] < BLDG_CHUNK_CAP) {
    const idx = bldgCount[c]++; setBldgInstance(c, idx, tile, variant);
    propAt.set(tile, { c, layer: 1, idx }); const m = bldgMeshes[c]; m.count = bldgCount[c]; m.visible = true; totalBldgs++; dirtyChunks.add(c);
  }
}
function removeProp(tile) {
  const e = propAt.get(tile); if (!e) return;
  const c = e.c;
  if (e.layer === 0) {
    const last = --treeCount[c], m = treeMeshes[c];
    if (e.idx !== last) {
      m.getMatrixAt(last, dummy.matrix); m.setMatrixAt(e.idx, dummy.matrix);
      const mt = treeTileOf[c][last]; treeTileOf[c][e.idx] = mt; propAt.get(mt).idx = e.idx;
    }
    m.count = treeCount[c]; if (treeCount[c] === 0) m.visible = false; totalTrees--;
  } else {
    const last = --bldgCount[c], m = bldgMeshes[c];
    if (e.idx !== last) {
      m.getMatrixAt(last, dummy.matrix); m.setMatrixAt(e.idx, dummy.matrix);
      const mt = bldgTileOf[c][last]; m.setColorAt(e.idx, bldgColorFor(mt)); bldgTileOf[c][e.idx] = mt; propAt.get(mt).idx = e.idx;
    }
    m.count = bldgCount[c]; if (bldgCount[c] === 0) m.visible = false; totalBldgs--;
  }
  dirtyChunks.add(c);
  propAt.delete(tile);
}
function flushProps() {
  for (const c of dirtyChunks) {
    treeMeshes[c].instanceMatrix.needsUpdate = true;
    bldgMeshes[c].instanceMatrix.needsUpdate = true;
    if (bldgMeshes[c].instanceColor) bldgMeshes[c].instanceColor.needsUpdate = true;
  }
  dirtyChunks.clear();
}

// starting scene: textured terrain + a lake, with ~5% of land covered by trees & buildings
function rb() { return Math.random() * 255 | 0; }
function fillWorld() {                                          // counts/pools already reset in createWorld
  const lakeX = N * 0.72, lakeZ = N * 0.30, lakeR = N * 0.11, lakeR2 = lakeR * lakeR;
  const p = Math.min(0.05, NCHUNK * (TREE_CHUNK_CAP + BLDG_CHUNK_CAP) / (N * N));   // 5%, capped to the pool budget
  for (let z = 0; z < N; z++) {
    for (let x = 0; x < N; x++) {
      const tile = z * N + x;
      const dx = x - lakeX, dz = z - lakeZ;
      if (dx * dx + dz * dz < lakeR2) { stateData[tile] = WATER0 + (Math.random() < 0.5 ? 0 : 1); continue; }
      stateData[tile] = GRASS0 + (Math.random() * GRASS_N | 0);
      if (Math.random() < p) {
        if (Math.random() < 0.82) addProp(tile, PROP.TREE, rb());
        else { stateData[tile] = ROCK0 + (Math.random() * 6 | 0); addProp(tile, PROP.BLDG, rb()); }
      }
    }
  }
  stateTex.needsUpdate = true;
  flushProps();
}

// ───────────────────────────── picking (ray vs y=0 plane) ────────────────────────────────
const raycaster = new THREE.Raycaster();
const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hit = new THREE.Vector3();
const ndc = new THREE.Vector2();
function tileAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (!raycaster.ray.intersectPlane(plane, hit)) return null;
  const tx = Math.floor((hit.x + HALF) / WORLD * N);
  const tz = Math.floor((hit.z + HALF) / WORLD * N);
  return (tx < 0 || tz < 0 || tx >= N || tz >= N) ? null : { tx, tz };
}

// ───────────────────────────── editing ─────────────────────────────
let editsThisSec = 0;
function applyTool(x, z) {
  const tile = z * N + x;
  switch (currentTool) {
    case 'tree':  stateData[tile] = GRASS0 + (Math.random() * GRASS_N | 0); addProp(tile, PROP.TREE, rb()); break;
    case 'bldg':  stateData[tile] = ROCK0 + (Math.random() * 6 | 0);        addProp(tile, PROP.BLDG, rb()); break;
    case 'road':  stateData[tile] = ROAD0 + (Math.random() * 4 | 0);        removeProp(tile); break;
    case 'grass': stateData[tile] = GRASS0 + (Math.random() * GRASS_N | 0); removeProp(tile); break;
    case 'water': stateData[tile] = WATER0 + (Math.random() < 0.5 ? 0 : 1); removeProp(tile); break;
    case 'clear': removeProp(tile); break;
  }
  editsThisSec++;
}
function paintRegion(txc, tzc) {
  const x0 = Math.max(0, txc - (brush >> 1)), z0 = Math.max(0, tzc - (brush >> 1));
  const x1 = Math.min(N, x0 + brush), z1 = Math.min(N, z0 + brush);
  for (let z = z0; z < z1; z++) for (let x = x0; x < x1; x++) applyTool(x, z);
  stateTex.needsUpdate = true;    // small terrain re-upload
  flushProps();
  renderer.shadowMap.needsUpdate = true;   // props may have changed -> refresh shadow map (one frame)
}

// stress: randomize 5% (capped) of terrain tiles every frame — scales because it's a texture write
function stressStep() {
  const k = Math.min((N * N * 0.05) | 0, STRESS_MAX);
  for (let j = 0; j < k; j++) {
    const t = (Math.random() * N * N) | 0;
    stateData[t] = GRASS0 + (Math.random() * GRASS_N | 0);
  }
  editsThisSec += k;
  stateTex.needsUpdate = true;
}

// ───────────────────────────── pointer (click vs orbit-drag) ─────────────────────────────
let downX = 0, downY = 0, moved = false;
const dom = renderer.domElement;
dom.addEventListener('pointerdown', (e) => { if (e.button === 0) { downX = e.clientX; downY = e.clientY; moved = false; } });
dom.addEventListener('pointermove', (e) => { if (Math.abs(e.clientX - downX) > 5 || Math.abs(e.clientY - downY) > 5) moved = true; });
dom.addEventListener('pointerup', (e) => {
  if (e.button !== 0 || moved) return;
  const t = tileAt(e.clientX, e.clientY);
  if (t) paintRegion(t.tx, t.tz);
});

// ───────────────────────────── UI wiring ─────────────────────────────
const TOOL_NAMES = { tree: 'Tree', bldg: 'Building', road: 'Road', grass: 'Grass', water: 'Water', clear: 'Clear' };
const elTool = document.getElementById('hud-tool');
function syncButtons() {
  document.querySelectorAll('#tools button').forEach((b) => b.classList.toggle('active', b.dataset.tool === currentTool));
  document.querySelectorAll('#brushes button').forEach((b) => b.classList.toggle('active', +b.dataset.brush === brush));
  document.querySelectorAll('#scales button').forEach((b) => b.classList.toggle('active', +b.dataset.n === N));
  elTool.textContent = `${TOOL_NAMES[currentTool]} · ${brush}×${brush}`;
}
document.querySelectorAll('#tools button').forEach((b) => b.addEventListener('click', () => { currentTool = b.dataset.tool; syncButtons(); }));
document.querySelectorAll('#brushes button').forEach((b) => b.addEventListener('click', () => { brush = +b.dataset.brush; syncButtons(); }));
document.querySelectorAll('#scales button').forEach((b) => b.addEventListener('click', () => switchScale(+b.dataset.n)));
const stressBtn = document.getElementById('stressBtn');
stressBtn.addEventListener('click', () => { stress = !stress; stressBtn.classList.toggle('on', stress); });

let shadows = true;
const shadowBtn = document.getElementById('shadowBtn');
function setShadows(on) {
  shadows = on;
  renderer.shadowMap.enabled = on;                 // skips the whole shadow pass when off
  renderer.shadowMap.needsUpdate = true;
  treeMat.needsUpdate = true; bldgMat.needsUpdate = true;       // shared across chunks
  if (terrainMesh) terrainMesh.material.needsUpdate = true;     // recompile w/o shadow code
  shadowBtn.classList.toggle('active', on);
  shadowBtn.textContent = on ? 'on' : 'off';
}
shadowBtn.addEventListener('click', () => setShadows(!shadows));

const loadingEl = document.getElementById('loading');
function switchScale(n) {
  if (n === N) return;
  loadingEl.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => { createWorld(n); syncButtons(); loadingEl.style.display = 'none'; }));
}
window.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '5') switchScale(SCALES[+e.key - 1]);
  else if (e.key === 'z' || e.key === 'Z') zoomBy(0.9);
  else if (e.key === 'x' || e.key === 'X') zoomBy(1.1);
  else if (e.key === 'h' || e.key === 'H') setShadows(!shadows);
  else if (e.key === 's' || e.key === 'S') { stress = !stress; stressBtn.classList.toggle('on', stress); }
});
const camOffset = new THREE.Vector3();
function zoomBy(f) {
  camOffset.copy(camera.position).sub(controls.target);
  camOffset.setLength(Math.min(controls.maxDistance, Math.max(controls.minDistance, camOffset.length() * f)));
  camera.position.copy(controls.target).add(camOffset);
  controls.update();
}

// ───────────────────────────── HUD / loop ─────────────────────────────
const elCalls = document.getElementById('hud-calls');
const elFps = document.getElementById('hud-fps');
const elGrid = document.getElementById('hud-grid');
const elTiles = document.getElementById('hud-tiles');
const elProps = document.getElementById('hud-props');
const elEdits = document.getElementById('hud-edits');
const spark = document.getElementById('spark');
const sctx = spark.getContext('2d');
const ftHist = new Float32Array(spark.width);
let ftIdx = 0;
function updateHudStatic() {
  elGrid.textContent = N + '×' + N;
  elTiles.textContent = (N * N).toLocaleString();
}
function drawSpark() {
  const w = spark.width, h = spark.height;
  sctx.clearRect(0, 0, w, h);
  const ty = h - Math.min(8.33 / 33.3, 1) * h;
  sctx.strokeStyle = 'rgba(90,210,139,0.35)'; sctx.beginPath(); sctx.moveTo(0, ty); sctx.lineTo(w, ty); sctx.stroke();
  sctx.strokeStyle = '#7fb2ff'; sctx.beginPath();
  for (let i = 0; i < w; i++) { const ms = ftHist[(ftIdx + i) % w]; const y = h - Math.min(ms / 33.3, 1) * h; i === 0 ? sctx.moveTo(i, y) : sctx.lineTo(i, y); }
  sctx.stroke();
}

let prev = performance.now(), fpsSmooth = 0, hudAccum = 0, secAccum = 0, edps = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = now - prev; prev = now;
  if (stress) stressStep();
  controls.update();
  renderer.render(scene, camera);

  const calls = renderer.info.render.calls;
  ftHist[ftIdx] = dt; ftIdx = (ftIdx + 1) % spark.width; drawSpark();
  fpsSmooth = fpsSmooth ? fpsSmooth * 0.9 + (1000 / dt) * 0.1 : 1000 / dt;
  secAccum += dt;
  if (secAccum >= 1000) { edps = editsThisSec; editsThisSec = 0; secAccum = 0; }
  hudAccum += dt;
  if (hudAccum >= 200) {
    hudAccum = 0;
    elCalls.textContent = calls;
    elCalls.className = 'v ' + (calls < 100 ? 'ok' : 'warn');
    elFps.textContent = fpsSmooth.toFixed(0);
    elProps.textContent = totalTrees.toLocaleString() + ' / ' + totalBldgs.toLocaleString();
    elEdits.textContent = edps.toLocaleString();
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// boot
createWorld(256);
syncButtons();
loadingEl.style.display = 'none';
requestAnimationFrame(frame);
</script>
</body>
</html>
