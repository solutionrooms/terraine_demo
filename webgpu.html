<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GPU City — WebGPU (compute-culled)</title>
<style>
  :root { --fg:#eaf0f8; --dim:#92a0b6; --ok:#5ad28b; --warn:#ffb03a; --gpu:#7fd0ff; }
  html, body { margin:0; height:100%; overflow:hidden; background:#9fc6e8; }
  canvas { display:block; }
  * { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #hud {
    position:fixed; top:14px; left:14px; z-index:10; pointer-events:none;
    color:var(--fg); background:rgba(14,20,30,0.74);
    border:1px solid rgba(255,255,255,0.10); border-radius:10px;
    padding:12px 14px 10px; width:236px; backdrop-filter:blur(6px);
    box-shadow:0 8px 28px rgba(0,0,0,0.45); user-select:none;
  }
  #hud .title { font-size:11px; letter-spacing:1.4px; color:var(--dim); margin-bottom:8px; }
  #hud .row { display:flex; justify-content:space-between; font-size:12px; line-height:20px; }
  #hud .k { color:var(--dim); } #hud .v { color:var(--fg); font-variant-numeric:tabular-nums; }
  #hud #be.gpu { color:var(--gpu); } #hud #be.gl { color:var(--warn); }
  .grp-label { font-size:10px; letter-spacing:1.2px; color:var(--dim); margin-top:11px; }
  .btns { display:flex; gap:5px; margin-top:5px; pointer-events:auto; flex-wrap:wrap; }
  .btns button, .btns a {
    flex:1 1 0; min-width:42px; pointer-events:auto; text-align:center; text-decoration:none;
    background:rgba(255,255,255,0.06); color:var(--fg); border:1px solid rgba(255,255,255,0.10);
    border-radius:6px; padding:6px 0; font-size:11px; cursor:pointer;
  }
  .btns button:hover, .btns a:hover { background:rgba(255,255,255,0.15); }
  .btns button.active { background:var(--ok); color:#06250f; border-color:var(--ok); }
  .hint { font-size:10.5px; color:var(--dim); margin-top:10px; line-height:15px; }
  #err { position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:40px;
    color:#ffd9d2; background:#1a0f12; font-size:13px; line-height:1.6; white-space:pre-wrap; z-index:50; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
    "three/webgpu": "https://unpkg.com/three@0.184.0/build/three.webgpu.js",
    "three/tsl": "https://unpkg.com/three@0.184.0/build/three.tsl.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="hud">
    <div class="title">GPU CITY · WEBGPU</div>
    <div class="row"><span class="k">Backend</span><span id="be" class="v">…</span></div>
    <div class="row"><span class="k">GPU ms</span><span id="ms" class="v">–</span></div>
    <div class="row"><span class="k">FPS</span><span id="fps" class="v">–</span></div>
    <div class="row"><span class="k">Draw calls</span><span id="calls" class="v">–</span></div>
    <div class="row"><span class="k">Instances</span><span id="inst" class="v">–</span></div>
    <div class="row"><span class="k">Drawn (visible)</span><span id="drawn" class="v">–</span></div>
    <div class="row"><span class="k">GPU cull</span><span id="cull" class="v">–</span></div>
    <div class="grp-label">RENDERER</div>
    <div class="btns">
      <button id="toWebGPU">WebGPU</button>
      <button id="toWebGL">WebGL2</button>
    </div>
    <div class="grp-label">COMPUTE CULLING</div>
    <div class="btns">
      <button id="cullBtn">GPU cull: on</button>
    </div>
    <div class="grp-label">LINKS</div>
    <div class="btns">
      <a href="index.html">‹ WebGL2 city demo</a>
    </div>
    <div class="hint">zoom in &amp; watch "drawn" fall as the GPU compute pass culls.<br>toggle cull, or switch backend, and compare GPU ms.</div>
  </div>
  <div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { Fn, instanceIndex, storage, uniform, float, positionLocal, If, texture, positionWorld, vec3 } from 'three/tsl';

const WORLD = 200, HALF = WORLD / 2;
const TREES = 60000, BLDGS = 12000;
const LAYERS = 32, TILE = 64, NT = 256;   // terrain: 32-texture atlas, 256x256 tile grid
const GRASS0 = 0, GRASS_N = 12, SAND0 = 12, ROCK0 = 18, ROAD0 = 24, WATER0 = 30;

// 32 procedural tile textures -> a DataArrayTexture (sampler2DArray), same as the WebGL2 demo
function clamp255(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }
function tileBase(l) {
  if (l < SAND0) { const t = l / GRASS_N; return [70 + t*30, 120 + (1-t)*40 + l*3, 50 + t*20]; }
  if (l < ROCK0) return [186 - (l-SAND0)*6, 168 - (l-SAND0)*5, 120 - (l-SAND0)*6];
  if (l < ROAD0) return [128 + (l-ROCK0)*4, 130 + (l-ROCK0)*4, 136 + (l-ROCK0)*3];
  if (l < WATER0) return [54 + (l-ROAD0)*3, 56 + (l-ROAD0)*3, 62 + (l-ROAD0)*3];
  return [40 + (l-WATER0)*8, 96 + (l-WATER0)*10, 150 + (l-WATER0)*16];
}
function genTileArray() {
  const data = new Uint8Array(TILE*TILE*4*LAYERS);
  for (let l = 0; l < LAYERS; l++) {
    const base = tileBase(l), noise = l < SAND0 ? 16 : l < ROAD0 ? 12 : l < WATER0 ? 7 : 18, off = l*TILE*TILE*4;
    for (let p = 0; p < TILE*TILE; p++) {
      const n = (Math.random()*2-1)*noise;
      data[off+p*4] = clamp255(base[0]+n); data[off+p*4+1] = clamp255(base[1]+n);
      data[off+p*4+2] = clamp255(base[2]+n); data[off+p*4+3] = 255;
    }
    if (l >= ROAD0 && l <= ROAD0+3) for (let y = 0; y < TILE; y++) { if ((y>>3)%2===0) continue;
      for (let x = 30; x < 34; x++) { const i = off+(y*TILE+x)*4; data[i]=220; data[i+1]=200; data[i+2]=70; } }
  }
  const tex = new THREE.DataArrayTexture(data, TILE, TILE, LAYERS);
  tex.format = THREE.RGBAFormat; tex.type = THREE.UnsignedByteType;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true; tex.needsUpdate = true;
  return tex;
}

const params = new URLSearchParams(location.search);
const forceGL = params.get('gl') === '1';

let renderer;
try {
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: forceGL });
  await renderer.init();
} catch (e) {
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = 'Renderer init failed:\n' + (e && e.message ? e.message : e) +
    '\n\nWebGPU available: ' + (!!navigator.gpu) + (forceGL ? '\n(forced WebGL2 fallback)' : '');
  throw e;
}
const isWebGPU = renderer.backend && renderer.backend.isWebGPUBackend === true;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

// GPU timestamps (WebGPU). Guarded — falls back to frame interval if unavailable.
let hasTimestamp = false;
try { if (renderer.backend && 'trackTimestamp' in renderer.backend) { renderer.backend.trackTimestamp = true; hasTimestamp = true; } } catch (e) {}

const scene = new THREE.Scene();
const sky = new THREE.Color(0x9fc6e8);
scene.background = sky;
scene.fog = new THREE.Fog(sky, WORLD * 0.9, WORLD * 2.6);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.5, 3000);
camera.position.set(WORLD * 0.42, WORLD * 0.5, WORLD * 0.72);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 14; controls.maxDistance = 900;
controls.update();

const sun = new THREE.DirectionalLight(0xfff1d8, 2.7);
sun.position.set(WORLD * 0.5, WORLD * 0.42, WORLD * 0.32);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = WORLD * 3;
const sc = HALF * 1.4;
sun.shadow.camera.left = -sc; sun.shadow.camera.right = sc; sun.shadow.camera.top = sc; sun.shadow.camera.bottom = -sc;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x55692f, 0.55));

// ── textured terrain: per-tile index in an R8 state texture, colour from a 32-layer atlas (TSL) ──
const tileArrayTex = genTileArray();
const stateData = new Uint8Array(NT * NT);
(function fillState() {
  const lakeX = NT*0.72, lakeZ = NT*0.30, lr2 = (NT*0.11)*(NT*0.11);
  for (let z = 0; z < NT; z++) for (let x = 0; x < NT; x++) {
    const t = z*NT + x, dx = x-lakeX, dz = z-lakeZ;
    if (dx*dx+dz*dz < lr2) { stateData[t] = WATER0 + (Math.random()<0.5?0:1); continue; }
    if (x % 12 === 0 || z % 12 === 0) { stateData[t] = ROAD0 + (Math.random()*4|0); continue; }
    stateData[t] = GRASS0 + (Math.random()*GRASS_N|0);
  }
})();
const stateTex = new THREE.DataTexture(stateData, NT, NT, THREE.RedFormat, THREE.UnsignedByteType);
stateTex.magFilter = stateTex.minFilter = THREE.NearestFilter;
stateTex.wrapS = stateTex.wrapT = THREE.ClampToEdgeWrapping;
stateTex.unpackAlignment = 1; stateTex.needsUpdate = true;

const terrainMat = new THREE.MeshLambertNodeMaterial();
{
  const cell = positionWorld.xz.add(HALF).div(WORLD).mul(NT);   // tile-space coord
  const id = cell.floor();
  const layer = texture(stateTex, id.add(0.5).div(NT)).r.mul(255).round();   // terrain index 0..31
  terrainMat.colorNode = texture(tileArrayTex, cell.fract()).depth(layer);   // sample that atlas layer
}
const ground = new THREE.Mesh(new THREE.PlaneGeometry(WORLD, WORLD), terrainMat);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
scene.add(ground);

// low-poly tree (~3 cones + trunk), vertex coloured
function addColor(g, r, gg, b) {
  const n = g.attributes.position.count, c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { c[i*3]=r; c[i*3+1]=gg; c[i*3+2]=b; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  if (g.attributes.uv) g.deleteAttribute('uv');
  return g;
}
const treeGeo = mergeGeometries([
  addColor(new THREE.CylinderGeometry(0.06,0.09,0.55,10).translate(0,0.275,0), 0.37,0.25,0.14),
  addColor(new THREE.ConeGeometry(0.46,0.6,18).translate(0,0.7,0), 0.17,0.43,0.19),
  addColor(new THREE.ConeGeometry(0.34,0.55,18).translate(0,1.0,0), 0.20,0.47,0.21),
  addColor(new THREE.ConeGeometry(0.22,0.5,18).translate(0,1.3,0), 0.24,0.52,0.24),
], false);
treeGeo.computeVertexNormals();
const bldgGeo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);

const treeMat = new THREE.MeshLambertNodeMaterial({ vertexColors: true });
const bldgMat = new THREE.MeshLambertNodeMaterial({ color: 0x9a9c9f });

const trees = new THREE.InstancedMesh(treeGeo, treeMat, TREES);
const bldgs = new THREE.InstancedMesh(bldgGeo, bldgMat, BLDGS);
for (const m of [trees, bldgs]) { m.castShadow = true; m.receiveShadow = true; m.frustumCulled = false; }

// per-instance data the compute pass reads: vec4(centre.xyz, boundingRadius) + a visibility float
const treePos = new THREE.StorageBufferAttribute(TREES, 4), treeVis = new THREE.StorageBufferAttribute(TREES, 1);
const bldgPos = new THREE.StorageBufferAttribute(BLDGS, 4), bldgVis = new THREE.StorageBufferAttribute(BLDGS, 1);

const dummy = new THREE.Object3D();
let seed = 1; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
for (let i = 0; i < TREES; i++) {
  const x = (rnd()*2-1)*HALF, z = (rnd()*2-1)*HALF;
  dummy.position.set(x, 0, z); dummy.rotation.set(0, rnd()*6.283, 0);
  const s = 1.4 + rnd()*1.1; dummy.scale.set(s, s, s);
  dummy.updateMatrix(); trees.setMatrixAt(i, dummy.matrix);
  treePos.array.set([x, 1.5*s, z, 3.0*s], i*4); treeVis.array[i] = 1;
}
for (let i = 0; i < BLDGS; i++) {
  const x = (rnd()*2-1)*HALF, z = (rnd()*2-1)*HALF;
  dummy.position.set(x, 0, z); dummy.rotation.set(0, (Math.floor(rnd()*4))*1.5708, 0);
  const h = rnd(), hy = 2 + h*h*12; dummy.scale.set(1.0+rnd()*0.6, hy, 1.0+rnd()*0.6);
  dummy.updateMatrix(); bldgs.setMatrixAt(i, dummy.matrix);
  bldgPos.array.set([x, hy*0.5, z, hy*0.6 + 3], i*4); bldgVis.array[i] = 1;
}
trees.instanceMatrix.needsUpdate = true; bldgs.instanceMatrix.needsUpdate = true;
scene.add(trees, bldgs);

// ── GPU compute frustum cull (WebGPU backend only — WebGL2 has no compute/storage) ──────────
const planeU = []; for (let i = 0; i < 6; i++) planeU.push(uniform(new THREE.Vector4()));
const uCull = uniform(1);                       // 1 = culling active, 0 = draw everything
const _frustum = new THREE.Frustum(), _vpm = new THREE.Matrix4();
let treeCull = null, bldgCull = null;
function updateFrustum() {
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  _vpm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_vpm);
  for (let i = 0; i < 6; i++) { const p = _frustum.planes[i]; planeU[i].value.set(p.normal.x, p.normal.y, p.normal.z, p.constant); }
}
if (isWebGPU) {
  const treePosS = storage(treePos, 'vec4', TREES), treeVisS = storage(treeVis, 'float', TREES);
  const bldgPosS = storage(bldgPos, 'vec4', BLDGS), bldgVisS = storage(bldgVis, 'float', BLDGS);
  const kernel = (posS, visS) => Fn(() => {
    const p = posS.element(instanceIndex);
    const vis = float(1).toVar();
    const test = (pl) => If(pl.xyz.dot(p.xyz).add(pl.w).lessThan(p.w.negate()), () => { vis.assign(0); });
    test(planeU[0]); test(planeU[1]); test(planeU[2]); test(planeU[3]); test(planeU[4]); test(planeU[5]);
    visS.element(instanceIndex).assign(vis);
  });
  treeCull = kernel(treePosS, treeVisS)().compute(TREES);
  bldgCull = kernel(bldgPosS, bldgVisS)().compute(BLDGS);
  // degenerate culled instances in the vertex stage; uCull gates the whole effect for A/B comparison
  treeMat.positionNode = positionLocal.mul(treeVisS.element(instanceIndex).max(float(1).sub(uCull)));
  bldgMat.positionNode = positionLocal.mul(bldgVisS.element(instanceIndex).max(float(1).sub(uCull)));
}

// HUD
const beEl = document.getElementById('be');
beEl.textContent = isWebGPU ? 'WebGPU' : 'WebGL2 (fallback)';
beEl.className = 'v ' + (isWebGPU ? 'gpu' : 'gl');
document.getElementById('inst').textContent = (TREES + BLDGS).toLocaleString();
document.getElementById('toWebGPU').classList.toggle('active', isWebGPU);
document.getElementById('toWebGL').classList.toggle('active', !isWebGPU);
document.getElementById('toWebGPU').onclick = () => { location.search = ''; };
document.getElementById('toWebGL').onclick = () => { location.search = '?gl=1'; };

let cullOn = true;
const cullBtn = document.getElementById('cullBtn'), elCullV = document.getElementById('cull');
if (isWebGPU) {
  const setCull = (on) => {
    cullOn = on; uCull.value = on ? 1 : 0;
    cullBtn.classList.toggle('active', on);
    cullBtn.textContent = on ? 'GPU cull: ON' : 'GPU cull: OFF';
    elCullV.textContent = on ? 'on (frustum)' : 'off (drawing all)';
  };
  cullBtn.onclick = () => setCull(!cullOn);
  setCull(true);
} else {
  cullOn = false; cullBtn.disabled = true; cullBtn.style.opacity = 0.5;
  cullBtn.textContent = 'GPU cull — WebGPU only'; elCullV.textContent = 'n/a (no compute)';
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const elMs = document.getElementById('ms'), elFps = document.getElementById('fps'),
      elCalls = document.getElementById('calls'), elDrawn = document.getElementById('drawn');
let prev = performance.now(), fpsSmooth = 0, gpuMs = 0, acc = 0, resolvePending = false;

// read the visibility buffers back to count how many instances survive culling (proof + metric)
let visCount = -1, readPending = false, readAcc = 0;
async function readVisible() {
  if (readPending || !isWebGPU || typeof renderer.getArrayBufferAsync !== 'function') return;
  readPending = true;
  try {
    const tb = new Float32Array(await renderer.getArrayBufferAsync(treeVis));
    const bb = new Float32Array(await renderer.getArrayBufferAsync(bldgVis));
    let c = 0; for (let i = 0; i < tb.length; i++) c += tb[i]; for (let i = 0; i < bb.length; i++) c += bb[i];
    visCount = c | 0;
  } catch (e) { visCount = -2; } finally { readPending = false; }
}

function animate() {
  const now = performance.now(), dt = now - prev; prev = now;
  controls.update();
  if (treeCull && cullOn) {                 // run the GPU frustum-cull compute pass before the render
    updateFrustum();
    renderer.compute(treeCull);
    renderer.compute(bldgCull);
  }
  renderer.render(scene, camera);

  // GPU time via WebGPU timestamps — one resolve in flight at a time; ignore absurd values
  if (hasTimestamp && !resolvePending) {
    resolvePending = true;
    renderer.resolveTimestampsAsync(THREE.TimestampQuery.RENDER).then((ms) => {
      resolvePending = false;
      const v = typeof ms === 'number' ? ms : renderer.info.render.timestamp;
      if (v > 0 && v < 2000) gpuMs = gpuMs ? gpuMs*0.85 + v*0.15 : v;
    }).catch(() => { resolvePending = false; });
  }
  fpsSmooth = fpsSmooth ? fpsSmooth*0.9 + (1000/dt)*0.1 : 1000/dt;
  readAcc += dt;
  if (cullOn && readAcc >= 350) { readAcc = 0; readVisible(); }
  acc += dt;
  if (acc >= 200) {
    acc = 0;
    elFps.textContent = fpsSmooth.toFixed(0);
    elMs.textContent = (gpuMs ? gpuMs : 1000/fpsSmooth).toFixed(2);
    elCalls.textContent = renderer.info.render.drawCalls;
    elDrawn.textContent = !isWebGPU ? (TREES + BLDGS).toLocaleString()
      : !cullOn ? (TREES + BLDGS).toLocaleString() + ' (all)'
      : visCount >= 0 ? visCount.toLocaleString() : '…';
  }
}
renderer.setAnimationLoop(animate);
</script>
</body>
</html>
